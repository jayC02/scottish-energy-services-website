              - text: . Reviewed against the official and technical sources below.
            - generic [ref=e112]:
              - heading "What is Section 63?" [level=2] [ref=e113]
              - paragraph [ref=e114]: Section 63 of the Climate Change (Scotland) Act 2009 provides the basis for assessing and improving the energy performance and emissions of existing non-domestic buildings. The detailed assessment duties are set out in the 2016 Regulations. This is an additional Scottish process, not another name for an EPC.
            - generic [ref=e115]:
              - heading "Which buildings and transactions are covered?" [level=2] [ref=e116]
              - paragraph [ref=e117]: "The regulations concern non-domestic buildings, or building units, with a floor area greater than 1,000 m² when sold or leased to a new tenant. Floor area alone does not settle applicability: the transaction, building boundaries and exemptions must also be checked. An existing occupation or a refinancing exercise is not, by itself, the same as a sale or new letting."
            - generic [ref=e118]:
              - heading "Are there exemptions?" [level=2] [ref=e119]
              - paragraph [ref=e120]: Not all commercial properties are covered. Scottish Government guidance identifies buildings meeting energy standards equivalent to the 2002 building regulations, and buildings already improved through a qualifying Green Deal, as exemptions. Evidence of equivalent performance matters; do not assume an exemption solely from an approximate construction date. EPC exclusions and the precise transaction should also be reviewed before instruction.
            - generic [ref=e121]:
              - heading "What happens when a building is sold or leased?" [level=2] [ref=e122]
              - paragraph [ref=e123]: Where the rules apply, the owner must obtain an Action Plan. It must be available to prospective buyers or tenants and supplied to the new owner or tenant. A lease to a new tenant is a trigger; do not automatically treat every lease event as identical. Ask the transaction team to confirm the arrangement and the owner’s responsibilities early.
            - generic [ref=e124]:
              - heading "What is a Section 63 Action Plan?" [level=2] [ref=e125]
              - paragraph [ref=e126]: The Action Plan records improvement targets and measures for the building’s energy and carbon performance. It is prepared by a registered Section 63 adviser and lodged on the Scottish EPC Register. The assessment may identify fabric, lighting or building-services improvements; the relevant measures are determined for the actual building rather than taken from a universal upgrade list.
            - generic [ref=e127]:
              - heading "What improvement measures can be identified?" [level=2] [ref=e128]
              - paragraph [ref=e129]: Measures can include roof insulation, draught proofing and lighting controls where the assessment conditions are met. The building-specific assessment establishes the targets and suitable measures; it does not mean every property must install every measure. Discuss practical constraints and any proposed alternative approach with the adviser before committing to works.
            - generic [ref=e130]:
              - heading "What happens after the Action Plan?" [level=2] [ref=e131]
              - paragraph [ref=e132]: The owner chooses between carrying out the identified improvements and the permitted operational-rating route for deferring improvements. The regulations provide a 42-month period for completing improvement measures. Confirm the applicable deadline and completion evidence against the final Action Plan and any valid deferral arrangements. SES can explain the assessment outputs; the owner and project team remain responsible for arranging and evidencing the required follow-up.
            - generic [ref=e133]:
              - heading "Can improvements be deferred using a DEC?" [level=2] [ref=e134]
              - paragraph [ref=e135]: Scottish Government guidance allows improvements to be deferred through annual reporting of operational energy performance using a Display Energy Certificate (DEC). This uses measured consumption and requires continuing reporting; it is not a permanent exemption or a way to avoid obtaining the Action Plan. Confirm access to energy data and responsibility for annual renewals before choosing this route.
            - generic [ref=e136]:
              - heading "How is Section 63 different from an EPC?" [level=2] [ref=e137]
              - paragraph [ref=e138]: A commercial EPC is an asset assessment of the building under standard assumptions. A Section 63 Action Plan addresses improvement targets for a qualifying building. A DEC records operational performance based on measured use. These documents have different purposes and one should not be assumed to replace the others.
            - generic [ref=e139]:
              - heading "When should I start the assessment?" [level=2] [ref=e140]
              - paragraph [ref=e141]: Start while preparing the property for marketing, rather than shortly before exchange or a new lease. The initial scope review needs the existing EPC, measured floor area, drawings and evidence relevant to exemptions. Allow time to clarify shared services, access restrictions and missing records.
            - generic [ref=e142]:
              - heading "How does SES handle an instruction?" [level=2] [ref=e143]
              - paragraph [ref=e144]: We review the available information, confirm the scope and fee, arrange the survey and assessment work, and explain the resulting documentation and next steps. Glasgow, Edinburgh and Central Belt instructions can be considered alongside wider Scottish sites. Timing depends on the building, access and the evidence available; confirm the required transaction date when enquiring.
            - generic [ref=e145]:
              - heading "What information should I send?" [level=2] [ref=e146]
              - list [ref=e147]:
                - listitem [ref=e148]: Address, building use, floor area and boundaries of the property being sold or let
                - listitem [ref=e149]: Existing EPC, any previous Action Plan or DEC, and evidence relevant to exemptions
                - listitem [ref=e150]: Plans and information on insulation, lighting, heating, cooling and ventilation
                - listitem [ref=e151]: Sale or new-lease timetable, survey access and the owner’s contact details
                - listitem [ref=e152]: Metered consumption and reporting arrangements if considering the DEC route
